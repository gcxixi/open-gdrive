name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
      version_code:
        description: Monotonically increasing Android version code
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/open-gdrive-release.jks"
      - name: Test and build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/open-gdrive-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew testReleaseUnitTest assembleRelease
          -PVERSION_NAME=${{ inputs.version }}
          -PVERSION_CODE=${{ inputs.version_code }}
          --stacktrace
      - name: Prepare release asset
        env:
          VERSION: ${{ inputs.version }}
        run: cp app/build/outputs/apk/release/app-release.apk "open-gdrive-v${VERSION}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v${VERSION}"
          "open-gdrive-v${VERSION}.apk"
          --target "${GITHUB_SHA}"
          --title "Open GDrive v${VERSION}"
          --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: open-gdrive-release-${{ inputs.version }}
          path: open-gdrive-v${{ inputs.version }}.apk

